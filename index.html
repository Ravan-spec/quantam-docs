
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#24569a">
<title>QUANTAM DOCS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;
 background:#fff;
 color:#202124;
 min-height:100vh;
 padding-bottom:75px;
}
button,input{font:inherit}
button{cursor:pointer}

.header{
 height:72px;
 background:#24569a;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 22px;
 position:sticky;
 top:0;
 z-index:20;
 box-shadow:0 2px 6px #0002;
}
.brand-area{display:flex;align-items:center;gap:15px}
.avatar{
 width:42px;height:42px;border-radius:50%;
 background:#dce8f8;color:#24569a;
 display:grid;place-items:center;
 font-weight:bold;font-size:15px;
}
.brand{font-size:21px;font-weight:700;letter-spacing:.3px}
.header-actions{display:flex;align-items:center;gap:20px}
.header-btn{
 border:0;background:transparent;color:white;
 font-size:25px;width:36px;height:42px;
 display:grid;place-items:center;
}
.header-btn:hover{background:#ffffff20;border-radius:8px}

.container{
 max-width:1050px;
 margin:auto;
 padding:24px 22px;
}
.section-heading{
 font-size:19px;font-weight:700;
 margin:4px 0 22px;
}
.group-title{
 color:#555;
 font-size:16px;
 font-weight:600;
 margin:20px 0 12px;
}
.document-list{display:flex;flex-direction:column}
.document{
 min-height:82px;
 display:flex;
 align-items:center;
 gap:16px;
 padding:12px 8px;
 border-bottom:1px solid #ededed;
}
.doc-icon{
 width:48px;height:48px;flex-shrink:0;
 display:grid;place-items:center;
}
.doc-icon svg{width:43px;height:43px}
.doc-info{min-width:0;flex:1}
.doc-title{
 font-size:16px;font-weight:600;
 overflow-wrap:anywhere;
 margin-bottom:6px;
}
.doc-location{font-size:13px;color:#777}
.menu-wrap{position:relative}
.menu-button{
 border:0;background:transparent;
 width:38px;height:42px;
 font-size:25px;color:#333;
 border-radius:8px;
}
.menu-button:hover{background:#f0f2f5}
.menu{
 position:absolute;right:0;top:40px;
 width:160px;background:#fff;
 box-shadow:0 4px 18px #0002;
 border:1px solid #eee;border-radius:9px;
 z-index:15;padding:5px;
 display:none;
}
.menu.show{display:block}
.menu button{
 display:block;width:100%;text-align:left;
 padding:11px 12px;border:0;
 background:white;border-radius:6px;
 font-size:14px;
}
.menu button:hover{background:#f0f4fa}
.menu .delete{color:#c62828}

.search-panel{
 display:none;
 padding:12px 0 18px;
}
.search-panel.show{display:block}
.search-input{
 width:100%;height:45px;
 padding:0 14px;border:1px solid #c9d1dc;
 border-radius:8px;outline:none;
}
.search-input:focus{border-color:#24569a}

.empty{
 text-align:center;
 padding:55px 15px;
 color:#777;
 line-height:1.7;
}
.empty strong{display:block;color:#333;font-size:17px;margin-bottom:8px}
.empty button{
 background:#24569a;color:#fff;
 border:0;border-radius:7px;
 padding:11px 18px;margin-top:15px;
}
.status{
 color:#888;font-size:12px;
 padding:14px 8px;
}
.bottom-nav{
 position:fixed;bottom:0;left:0;right:0;
 height:72px;background:white;
 border-top:1px solid #e6e6e6;
 display:flex;align-items:center;
 justify-content:space-around;
 z-index:30;
}
.nav-item{
 border:0;background:transparent;
 color:#666;min-width:85px;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 gap:4px;font-size:12px;
}
.nav-icon{font-size:23px;line-height:25px}
.nav-item.active{color:#24569a;font-weight:700}
.nav-item.active .nav-icon{
 background:#e7effb;border-radius:22px;
 padding:1px 13px;
}
.screen{display:none}
.screen.active{display:block}

@media(min-width:760px){
 .container{padding-top:35px}
 .document{padding:15px 12px}
 .doc-title{font-size:17px}
 .bottom-nav{
  position:static;
  max-width:1050px;
  margin:20px auto 0;
  border:1px solid #eee;
  border-radius:12px;
  height:68px;
 }
 body{padding-bottom:15px}
}
@media(max-width:480px){
 .header{height:64px;padding:0 13px}
 .brand{font-size:18px}
 .avatar{width:37px;height:37px}
 .header-actions{gap:8px}
 .container{padding:20px 12px}
 .document{gap:10px;min-height:76px}
 .doc-title{font-size:14px}
 .doc-location{font-size:12px}
 .doc-icon{width:40px;height:44px}
 .doc-icon svg{width:37px;height:37px}
}
</style>
</head>

<body>

<header class="header">
 <div class="brand-area">
  <div class="avatar">Q</div>
  <div class="brand">QUANTAM DOCS</div>
 </div>

 <div class="header-actions">
  <button class="header-btn" id="searchToggle" title="Search">⌕</button>
  <button class="header-btn" id="newDocument" title="New Document">＋</button>
 </div>
</header>

<main class="container">

 <section class="screen active" id="recentScreen">
  <div class="section-heading">Recent</div>

  <div class="search-panel" id="searchPanel">
   <input class="search-input" id="searchInput"
    type="search" placeholder="Search documents...">
  </div>

  <div id="recentList">
   <div class="empty">Loading documents...</div>
  </div>

  <div class="status" id="dbStatus">
   Connecting to your document library...
  </div>
 </section>

 <section class="screen" id="sharedScreen">
  <div class="section-heading">Shared</div>
  <div class="empty">
   <strong>No shared documents</strong>
   Document sharing will be available in a future update.
  </div>
 </section>

 <section class="screen" id="openScreen">
  <div class="section-heading">Open Documents</div>
  <div class="empty">
   <strong>Open your document workspace</strong>
   Continue editing your saved documents.
   <br>
   <button onclick="openEditor()">Open Editor</button>
  </div>
 </section>

</main>

<nav class="bottom-nav">
 <button class="nav-item active" data-screen="recentScreen">
  <span class="nav-icon">◷</span>
  <span>Recent</span>
 </button>

 <button class="nav-item" data-screen="sharedScreen">
  <span class="nav-icon">♧</span>
  <span>Shared</span>
 </button>

 <button class="nav-item" data-screen="openScreen">
  <span class="nav-icon">▱</span>
  <span>Open</span>
 </button>
</nav>

<script>
'use strict';

const DB_NAME='QUANTAM_DOCS_LIBRARY';
const DB_VERSION=1;

let documents=[];
let db=null;

const $=id=>document.getElementById(id);

function openEditor(){
 window.location.href='./editor.html';
}

function openDatabase(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open(DB_NAME,DB_VERSION);

  request.onsuccess=()=>{
   const database=request.result;

   if(!database.objectStoreNames.contains('documents')){
    database.close();
    reject(new Error('Document store not found'));
    return;
   }
   resolve(database);
  };

  request.onerror=()=>reject(request.error);
 }

 );
}

function documentIcon(){
 return `
 <svg viewBox="0 0 48 48" fill="none">
  <rect x="5" y="5" width="35" height="38" rx="5"
   fill="#e5f0ff" stroke="#8aa8d5" stroke-width="1.5"/>
  <path d="M12 5V43" stroke="#24569a" stroke-width="3"/>
  <path d="M18 16H33M18 22H33M18 28H30"
   stroke="#6b8ebd" stroke-width="2" stroke-linecap="round"/>
  <rect x="2" y="31" width="22" height="13" rx="3" fill="#24569a"/>
  <text x="13" y="41" font-size="10" font-weight="bold"
   text-anchor="middle" fill="white">Q</text>
 </svg>`;
}

function formatDate(value){
 if(!value)return 'This device';
 const date=new Date(value);
 if(Number.isNaN(date.getTime()))return 'This device';

 return 'This device · '+date.toLocaleDateString();
}

function isThisWeek(value){
 if(!value)return false;
 const date=new Date(value);
 if(Number.isNaN(date.getTime()))return false;

 const now=new Date();
 const start=new Date(now);
 start.setDate(now.getDate()-6);
 start.setHours(0,0,0,0);

 return date>=start && date<=now;
}

function createMenu(doc){
 const wrap=document.createElement('div');
 wrap.className='menu-wrap';

 const button=document.createElement('button');
 button.className='menu-button';
 button.textContent='⋮';
 button.setAttribute('aria-label','Document options');

 const menu=document.createElement('div');
 menu.className='menu';

 const open=document.createElement('button');
 open.textContent='Open';
 open.onclick=()=>openDocument(doc.id);

 const rename=document.createElement('button');
 rename.textContent='Rename';
 rename.onclick=()=>renameDocument(doc.id);

 const remove=document.createElement('button');
 remove.textContent='Delete';
 remove.className='delete';
 remove.onclick=()=>deleteDocument(doc.id);

 menu.append(open,rename,remove);
 button.onclick=(event)=>{
  event.stopPropagation();
  document.querySelectorAll('.menu.show').forEach(m=>{
   if(m!==menu)m.classList.remove('show');
  });
  menu.classList.toggle('show');
 };

 wrap.append(button,menu);
 return wrap;
}

function makeDocumentRow(doc){
 const row=document.createElement('div');
 row.className='document';

 const icon=document.createElement('div');
 icon.className='doc-icon';
 icon.innerHTML=documentIcon();

 const info=document.createElement('div');
 info.className='doc-info';

 const title=document.createElement('div');
 title.className='doc-title';
 title.textContent=doc.title||'Untitled document';

 const location=document.createElement('div');
 location.className='doc-location';
 location.textContent=formatDate(doc.updatedAt);

 info.append(title,location);

 row.append(icon,info,createMenu(doc));
 return row;
}

function renderDocuments(){
 const list=$('recentList');
 const query=$('searchInput').value.trim().toLowerCase();

 const filtered=documents.filter(doc=>
  (doc.title||'Untitled document').toLowerCase().includes(query)
 );

 list.innerHTML='';

 if(!filtered.length){
  list.innerHTML=`
   <div class="empty">
    <strong>No documents found</strong>
    Try another search or create a document.
    <br>
    <button onclick="openEditor()">Open Editor</button>
   </div>`;
  return;
 }

 const thisWeek=filtered.filter(d=>isThisWeek(d.updatedAt));
 const older=filtered.filter(d=>!isThisWeek(d.updatedAt));

 function addGroup(label,items){
  if(!items.length)return;

  const heading=document.createElement('div');
  heading.className='group-title';
  heading.textContent=label;
  list.appendChild(heading);

  const group=document.createElement('div');
  group.className='document-list';

  items.forEach(doc=>group.appendChild(makeDocumentRow(doc)));
  list.appendChild(group);
 }

 addGroup('This Week',thisWeek);
 addGroup('Older',older);
}

async function loadDocuments(){
 try{
  db=await openDatabase();

  const transaction=db.transaction('documents','readonly');
  const request=transaction.objectStore('documents').getAll();

  request.onsuccess=()=>{
   documents=request.result||[];

   documents.sort((a,b)=>
    (b.updatedAt||'').localeCompare(a.updatedAt||'')
   );

   renderDocuments();

   $('dbStatus').textContent=
    documents.length+' document(s) in your library';
  };

  request.onerror=()=>{
   $('dbStatus').textContent='Could not read document library.';
  };

 }catch(error){
  $('recentList').innerHTML=`
   <div class="empty">
    <strong>Document Library Not Available</strong>
    Open the editor once to initialize your document library.
    <br>
    <button onclick="openEditor()">Open Editor</button>
   </div>`;
  $('dbStatus').textContent='Library connection unavailable.';
 }
}

async function renameDocument(id){
 const doc=documents.find(d=>d.id===id);
 if(!doc)return;

 const name=prompt('Enter document name:',doc.title||'Untitled document');
 if(name===null)return;

 const clean=name.trim().slice(0,100);
 if(!clean){
  alert('Document name cannot be empty.');
  return;
 }

 try{
  const transaction=db.transaction('documents','readwrite');
  const store=transaction.objectStore('documents');

  doc.title=clean;
  doc.updatedAt=new Date().toISOString();
  store.put(doc);

  transaction.oncomplete=()=>{
   loadDocuments();
  };
  transaction.onerror=()=>{
   alert('Could not rename document.');
  };
 }catch(error){
  alert('Rename failed: '+error.message);
 }
}

async function deleteDocument(id){
 const doc=documents.find(d=>d.id===id);
 if(!doc)return;

 if(!confirm('Delete "'+(doc.title||'Untitled document')+'"? This cannot be undone.'))return;

 try{
  const transaction=db.transaction('documents','readwrite');
  transaction.objectStore('documents').delete(id);

  transaction.oncomplete=()=>{
   loadDocuments();
  };
  transaction.onerror=()=>{
   alert('Could not delete document.');
  };
 }catch(error){
  alert('Delete failed: '+error.message);
 }
}

function openDocument(id){
 window.location.href='./editor.html?doc='+encodeURIComponent(id);
}

$('searchToggle').addEventListener('click',()=>{
 $('searchPanel').classList.toggle('show');

 if($('searchPanel').classList.contains('show')){
  $('searchInput').focus();
 }else{
  $('searchInput').value='';
  renderDocuments();
 }
});

$('searchInput').addEventListener('input',renderDocuments);
$('newDocument').addEventListener('click',openEditor);

document.querySelectorAll('.nav-item').forEach(button=>{
 button.addEventListener('click',()=>{
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

  button.classList.add('active');
  $(button.dataset.screen).classList.add('active');
 });
});

document.addEventListener('click',event=>{
 if(!event.target.closest('.menu-wrap')){
  document.querySelectorAll('.menu.show').forEach(m=>m.classList.remove('show'));
 }
});

loadDocuments();
</script>

</body>
</html>
