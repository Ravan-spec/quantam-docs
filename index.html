
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>QUANTAM DOCS</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f4f6fb;
 color:#172033;
}
button,input{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.header{
 height:66px;
 background:#111827;
 color:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 22px;
 position:sticky;
 top:0;
 z-index:10;
}
.logo{font-size:21px;font-weight:800;letter-spacing:.5px}
.logo span{color:#60a5fa}
.header-actions{display:flex;gap:10px;align-items:center}
.new-btn{
 border:0;
 background:#2563eb;
 color:white;
 padding:11px 17px;
 border-radius:9px;
 font-weight:700;
}
.new-btn:hover{background:#1d4ed8}
.layout{
 display:grid;
 grid-template-columns:235px minmax(0,1fr);
 min-height:calc(100vh - 66px);
}
.sidebar{
 background:white;
 border-right:1px solid #e5e7eb;
 padding:22px 14px;
}
.nav-title{
 font-size:11px;
 color:#8a94a6;
 font-weight:700;
 padding:8px 12px;
 letter-spacing:1px;
}
.nav-item{
 width:100%;
 text-align:left;
 border:0;
 background:transparent;
 padding:12px;
 border-radius:8px;
 margin:3px 0;
 color:#475569;
 font-weight:600;
}
.nav-item:hover,.nav-item.active{
 background:#eff6ff;
 color:#2563eb;
}
.main{padding:30px;min-width:0}
.screen{display:none}
.screen.active{display:block}
.welcome{
 background:linear-gradient(120deg,#172554,#2563eb);
 color:white;
 border-radius:16px;
 padding:30px;
 margin-bottom:26px;
}
.welcome h1{margin:0 0 10px;font-size:27px}
.welcome p{margin:0;color:#dbeafe;line-height:1.6}
.section-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 margin:25px 0 15px;
}
.section-head h2{font-size:19px;margin:0}
.text-btn{
 border:0;
 background:transparent;
 color:#2563eb;
 font-weight:700;
}
.templates{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:15px;
}
.template{
 text-align:left;
 background:white;
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:17px;
 min-width:0;
 transition:.15s;
}
.template:hover{
 border-color:#60a5fa;
 transform:translateY(-2px);
 box-shadow:0 5px 18px #17203312;
}
.template-icon{
 width:45px;height:52px;
 display:grid;place-items:center;
 background:#eff6ff;
 color:#2563eb;
 border-radius:8px;
 font-size:23px;
 margin-bottom:13px;
}
.template strong{display:block;margin-bottom:6px}
.template small{color:#64748b;line-height:1.5}
.search-wrap{display:flex;gap:9px;max-width:480px}
.search-wrap input{
 width:100%;
 padding:12px 14px;
 border:1px solid #dce2eb;
 border-radius:9px;
 outline:none;
 background:white;
}
.search-wrap input:focus{border-color:#3b82f6}
.document-list{
 display:grid;
 gap:10px;
}
.document{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding:15px;
 background:white;
 border:1px solid #e5e7eb;
 border-radius:10px;
}
.document-info{min-width:0}
.document-info strong{
 display:block;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}
.document-info small{color:#64748b}
.open-doc{
 border:0;
 background:#eff6ff;
 color:#2563eb;
 padding:9px 13px;
 border-radius:7px;
 font-weight:700;
 flex-shrink:0;
}
.empty{
 text-align:center;
 padding:35px 15px;
 background:white;
 border:1px dashed #cbd5e1;
 border-radius:12px;
 color:#64748b;
}
.status{font-size:13px;color:#64748b;margin-top:12px}
@media(max-width:760px){
 .layout{grid-template-columns:1fr}
 .sidebar{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding:8px;
  border-right:0;
  border-bottom:1px solid #e5e7eb;
 }
 .nav-title{display:none}
 .nav-item{white-space:nowrap;width:auto;margin:0}
 .main{padding:17px}
 .templates{grid-template-columns:repeat(2,minmax(0,1fr))}
 .welcome{padding:22px}
 .welcome h1{font-size:23px}
}
@media(max-width:420px){
 .templates{grid-template-columns:1fr 1fr;gap:9px}
 .template{padding:12px}
 .header{padding:0 13px}
 .logo{font-size:18px}
 .new-btn{padding:10px 12px}
 .document{padding:12px}
}
</style>
</head>

<body>
<div class="app">

<header class="header">
 <div class="logo">QUANTAM <span>DOCS</span></div>
 <div class="header-actions">
  <button class="new-btn" id="newDocument">＋ New Document</button>
 </div>
</header>

<div class="layout">

<aside class="sidebar">
 <div class="nav-title">WORKSPACE</div>
 <button class="nav-item active" data-screen="homeScreen">⌂ Home</button>
 <button class="nav-item" data-screen="recentScreen">▤ Recent Documents</button>
 <button class="nav-item" id="templatesNav">＋ Templates</button>
</aside>

<main class="main">

<section class="screen active" id="homeScreen">

 <div class="welcome">
  <h1>Welcome to QUANTAM DOCS</h1>
  <p>Create, edit and organize your documents in one place.</p>
 </div>

 <div class="section-head">
  <h2>Create a document</h2>
 </div>

 <div class="templates">
  <button class="template" onclick="openNew()">
   <div class="template-icon">＋</div>
   <strong>Blank Document</strong>
   <small>Start with a new empty document.</small>
  </button>

  <button class="template" onclick="openNew()">
   <div class="template-icon">▤</div>
   <strong>Notes</strong>
   <small>Create notes and organize your ideas.</small>
  </button>

  <button class="template" onclick="openNew()">
   <div class="template-icon">▧</div>
   <strong>Professional Document</strong>
   <small>Start a professional document.</small>
  </button>
 </div>

 <div class="section-head">
  <h2>Recent Documents</h2>
  <button class="text-btn" onclick="showScreen('recentScreen')">View all</button>
 </div>

 <div id="homeDocuments" class="document-list">
  <div class="empty">Loading documents...</div>
 </div>

</section>

<section class="screen" id="recentScreen">
 <div class="section-head">
  <h2>Recent Documents</h2>
  <button class="new-btn" onclick="openNew()">＋ New</button>
 </div>

 <div class="search-wrap">
  <input id="searchInput" type="search" placeholder="Search your documents...">
 </div>

 <div style="height:15px"></div>
 <div id="allDocuments" class="document-list">
  <div class="empty">Loading documents...</div>
 </div>
</section>

</main>
</div>
</div>

<script>
"use strict";

const DB_NAME = "QUANTAM_DOCS_LIBRARY";
const DB_VERSION = 1;
const DOC_STORE = "documents";

const $ = id => document.getElementById(id);

let db = null;
let documents = [];

function openNew(){
 window.location.href = "./new.html";
}

function showScreen(id){
 document.querySelectorAll(".screen").forEach(screen=>{
  screen.classList.remove("active");
 });

 document.querySelectorAll(".nav-item").forEach(button=>{
  button.classList.remove("active");
 });

 const screen = $(id);
 if(screen) screen.classList.add("active");

 const nav = document.querySelector(
  '.nav-item[data-screen="' + id + '"]'
 );
 if(nav) nav.classList.add("active");

 if(id === "recentScreen") renderDocuments();
}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function openDocument(id){
 window.location.href =
  "./editor.html?doc=" + encodeURIComponent(id);
}

function openDatabase(){
 return new Promise((resolve,reject)=>{
  const request = indexedDB.open(DB_NAME,DB_VERSION);

  request.onupgradeneeded = event=>{
   const database = event.target.result;

   if(!database.objectStoreNames.contains(DOC_STORE)){
    database.createObjectStore(DOC_STORE,{keyPath:"id"});
   }

   if(!database.objectStoreNames.contains("folders")){
    database.createObjectStore("folders",{keyPath:"id"});
   }
  };

  request.onsuccess = ()=>resolve(request.result);
  request.onerror = ()=>reject(request.error);
 });
}

function getAllDocuments(){
 return new Promise((resolve,reject)=>{
  const transaction = db.transaction(DOC_STORE,"readonly");
  const request = transaction.objectStore(DOC_STORE).getAll();

  request.onsuccess = ()=>resolve(request.result || []);
  request.onerror = ()=>reject(request.error);
 });
}

function formatDate(value){
 if(!value) return "Recently edited";

 const date = new Date(value);
 if(Number.isNaN(date.getTime())) return "Recently edited";

 return date.toLocaleDateString(undefined,{
  day:"numeric",
  month:"short",
  year:"numeric"
 });
}

function documentCard(doc){
 const title = escapeHTML(doc.title || "Untitled document");

 return `
  <article class="document">
   <div class="document-info">
    <strong>${title}</strong>
    <small>Edited: ${formatDate(doc.updatedAt)}</small>
   </div>
   <button class="open-doc"
    data-open-doc="${escapeHTML(doc.id)}">Open</button>
  </article>
 `;
}

function renderDocuments(){
 const query = ($("searchInput")?.value || "").trim().toLowerCase();

 const sorted = [...documents].sort((a,b)=>
  String(b.updatedAt || "").localeCompare(String(a.updatedAt || ""))
 );

 const filtered = sorted.filter(doc=>
  String(doc.title || "Untitled document").toLowerCase().includes(query)
 );

 $("homeDocuments").innerHTML = sorted.length
  ? sorted.slice(0,5).map(documentCard).join("")
  : '<div class="empty">No documents yet. Click ＋ New Document to start.</div>';

 $("allDocuments").innerHTML = filtered.length
  ? filtered.map(documentCard).join("")
  : '<div class="empty">No matching documents found.</div>';
}

async function loadDocuments(){
 try{
  if(!window.indexedDB){
   throw new Error("IndexedDB is not supported in this browser.");
  }

  db = await openDatabase();
  documents = await getAllDocuments();
  renderDocuments();

 }catch(error){
  console.error(error);

  $("homeDocuments").innerHTML =
   '<div class="empty">Could not load documents. ' +
   escapeHTML(error.message) + '</div>';

  $("allDocuments").innerHTML =
   '<div class="empty">Could not load documents. ' +
   escapeHTML(error.message) + '</div>';
 }
}

$("newDocument").addEventListener("click",openNew);

$("templatesNav").addEventListener("click",openNew);

document.querySelectorAll(".nav-item[data-screen]").forEach(button=>{
 button.addEventListener("click",()=>{
  showScreen(button.dataset.screen);
 });
});

$("searchInput").addEventListener("input",renderDocuments);

document.addEventListener("click",event=>{
 const button = event.target.closest("[data-open-doc]");
 if(!button) return;

 openDocument(button.dataset.openDoc);
});

loadDocuments();
</script>
</body>
</html>
