<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f3f7;color:#172033;font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid #dce1ea;background:white;color:#172033;border-radius:7px;padding:8px 11px}
button.primary{background:#4f46e5;color:white;border-color:#4f46e5}
button.danger{color:#b42318}
.topbar{background:#111827;color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{font-size:17px;font-weight:800}.brand span{color:#a5b4fc}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions a{color:white;text-decoration:none;padding:8px}
.layout{max-width:1450px;margin:auto;padding:14px;display:grid;grid-template-columns:265px minmax(0,1fr);gap:14px}
.panel{background:white;border:1px solid #e0e5ee;border-radius:10px;padding:13px;min-width:0}
.sidebar h3{margin:2px 0 12px}

.docitem{border:1px solid #e4e8ef;border-radius:8px;padding:10px;text-align:left;width:100%;background:#fff}
.docitem.active{border-color:#6366f1;background:#eef2ff}
.docitem strong{display:block;overflow-wrap:anywhere}
.docitem small{display:block;color:#697386;margin-top:5px}
.main{min-width:0}
.docbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#docTitle{font-size:18px;font-weight:bold;border:1px solid transparent;background:transparent;padding:8px;min-width:180px;max-width:100%;border-radius:7px}
#docTitle:focus{outline:none;border-color:#a5b4fc;background:white}
#folderSelect{padding:8px;border:1px solid #dce1e9;border-radius:7px;background:white}
#status{font-size:12px;color:#697386}
.toolbar{background:white;border:1px solid #e0e5ee;border-radius:9px 9px 0 0;position:sticky;top:55px;z-index:10}

#editor{width:min(100%,794px);margin:auto;background:white;border:1px solid #d8deea;box-shadow:0 4px 18px #11182712}
#editor.ql-container{font-size:12pt;font-family:Arial,sans-serif}

.ql-snow .ql-picker.ql-font .ql-picker-label::before,
.ql-snow .ql-picker.ql-font .ql-picker-item::before{content:attr(data-value)}
.ql-snow .ql-picker.ql-font .ql-picker-label:not([data-value])::before,
.ql-snow .ql-picker.ql-font .ql-picker-item:not([data-value])::before{content:"Arial"}

@media print {

  @page {
    margin: 20mm;
  }

  html, body {
    background: white !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
  }

  /* Hide all application controls */
  .topbar,
  .sidebar,
  .docbar,
  .toolbar,
  .extra,
  .no-print,
  .main > :not(.stage) {
    display: none !important;
  }

  /* Keep only the document area */
  .layout {
    display: block !important;
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .main {
    display: block !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .stage {
    display: block !important;
    background: white !important;
    border: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  #editor {
    display: block !important;
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    box-shadow: none !important;
  }

  #editor .ql-editor {
    display: block !important;
    min-height: 0 !important;
    height: auto !important;
    padding: 0 !important;
    overflow: visible !important;
  }

  #editor .ql-editor img {
    max-width: 100% !important;
    height: auto;
  }

 
  #editor,
  #editor .ql-container,
  #editor .ql-editor,
  #editor .ql-editor p,
  #editor .ql-editor div,
  #editor .ql-editor h1,
  #editor .ql-editor h2,
  #editor .ql-editor h3,
  #editor .ql-editor li {
    break-before: auto !important;
    break-after: auto !important;
    page-break-before: auto !important;
    page-break-after: auto !important;
  }

  #editor .ql-editor {
    break-inside: auto !important;
    page-break-inside: auto !important;
    orphans: 2;
    widows: 2;
  }

  #editor .ql-editor p,
  #editor .ql-editor div,
  #editor .ql-editor li {
    break-inside: auto !important;
    page-break-inside: auto !important;
  }
 
}

<script>
(() => {
'use strict';

const DB_NAME='QUANTAM_DOCS_LIBRARY';
const DB_VERSION=1;
const DOC_STORE='documents';
const FOLDER_STORE='folders';

const FONT_NAMES=[
 'arial','aptos','calibri','cambria','times-new-roman',
 'georgia','verdana','tahoma','trebuchet-ms','courier-new',
 'consolas','garamond','book-antiqua','century-gothic',
 'comic-sans-ms','impact','palatino-linotype','lucida-console',
 'segoe-ui','microsoft-sans-serif','franklin-gothic','rockwell',
 'constantia','candara','corbel','century-schoolbook',
 'bahnschrift','mangal','nirmala-ui','utsaah','kokila'
];

let db=null;
let quill=null;
let currentId=null;
let saveTimer=null;
let isLoading=false;

const $=id=>document.getElementById(id);

function makeId(){
 return crypto.randomUUID ?
  crypto.randomUUID() :
  'doc-'+Date.now()+'-'+Math.random().toString(36).slice(2);
}

function status(message,error=false){
 $('status').textContent=message;
 $('status').style.color=error?'#b42318':'#697386';
}

function requestResult(request){
 return new Promise((resolve,reject)=>{
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}

function openDatabase(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=()=>{
   const database=req.result;
   if(!database.objectStoreNames.contains(DOC_STORE)){
    const store=database.createObjectStore(DOC_STORE,{keyPath:'id'});
    store.createIndex('updatedAt','updatedAt');
    store.createIndex('folder','folder');
   }
   if(!database.objectStoreNames.contains(FOLDER_STORE)){
    database.createObjectStore(FOLDER_STORE,{keyPath:'id'});
   }
  };
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}

function getAll(name){
 return requestResult(db.transaction(name,'readonly').objectStore(name).getAll());
}

function getOne(name,id){
 return requestResult(db.transaction(name,'readonly').objectStore(name).get(id));
}

function putOne(name,value){
 return requestResult(db.transaction(name,'readwrite').objectStore(name).put(value));
}

function deleteOne(name,id){
 return requestResult(db.transaction(name,'readwrite').objectStore(name).delete(id));
}

async function ensureFolder(){
 const folders=await getAll(FOLDER_STORE);
 if(!folders.length){
  await putOne(FOLDER_STORE,{
   id:'general',
   name:'General',
   createdAt:new Date().toISOString()
  });
 }
}

async function migrateOldDocument(){
 const docs=await getAll(DOC_STORE);
 if(docs.length)return;

 try{
  const raw=localStorage.getItem('quantam_docs_document_v2') ||
            localStorage.getItem('quantam_document');
  if(!raw)return;

  const old=JSON.parse(raw);
  const html=typeof old==='string'?old:
   old.html||old.content||old.contentHTML||'';

  await putOne(DOC_STORE,{
   id:makeId(),
   title:old.title||old.name||'Imported document',
   html,
   folder:'general',
   createdAt:new Date().toISOString(),
   updatedAt:new Date().toISOString()
  });
 }catch(e){
  console.warn('Old document migration:',e);
 }
}

async function refreshFolders(){
 const folders=await getAll(FOLDER_STORE);
 const filter=$('folderFilter');
 const select=$('folderSelect');
 const oldFilter=filter.value;
 const oldSelect=select.value;

 filter.innerHTML='<option value="all">All folders</option>';
 select.innerHTML='';

 folders.sort((a,b)=>a.name.localeCompare(b.name));

 for(const folder of folders){
  const a=document.createElement('option');
  a.value=folder.id;
  a.textContent=folder.name;
  filter.appendChild(a);

  const b=document.createElement('option');
  b.value=folder.id;
  b.textContent=folder.name;
  select.appendChild(b);
 }

 if([...filter.options].some(o=>o.value===oldFilter))filter.value=oldFilter;
 if([...select.options].some(o=>o.value===oldSelect))select.value=oldSelect;
}

async function refreshLibrary(){
 const docs=await getAll(DOC_STORE);
 const folders=await getAll(FOLDER_STORE);
 const folderMap=new Map(folders.map(f=>[f.id,f.name]));
 const query=$('searchDocs').value.trim().toLowerCase();
 const folder=$('folderFilter').value;

 const list=$('docList');
 list.innerHTML='';

 const results=docs.filter(d=>
  (folder==='all'||d.folder===folder)&&
  (d.title||'').toLowerCase().includes(query)
 ).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));

 if(!results.length){
  list.innerHTML='<div class="empty">No documents found.</div>';
  return;
 }

 results.forEach(doc=>{
  const btn=document.createElement('button');
  btn.type='button';
  btn.className='docitem'+(doc.id===currentId?' active':'');
  const title=document.createElement('strong');
  title.textContent=doc.title||'Untitled document';
  const small=document.createElement('small');
  small.textContent=(folderMap.get(doc.folder)||'General')+' · '+
   (doc.updatedAt?new Date(doc.updatedAt).toLocaleString():'');
  btn.append(title,small);
  btn.addEventListener('click',()=>openDocument(doc.id));
  list.appendChild(btn);
 });
}

async function saveCurrent(show=true){
 if(!currentId||!quill||isLoading)return false;
 clearTimeout(saveTimer);

 try{
  const old=await getOne(DOC_STORE,currentId);
  if(!old)return false;

  const doc={
   ...old,
   title:$('docTitle').value.trim()||'Untitled document',
   folder:$('folderSelect').value||'general',
   html:quill.root.innerHTML,
   updatedAt:new Date().toISOString()
  };

  await putOne(DOC_STORE,doc);
  if(show)status('Saved successfully');
  await refreshLibrary();
  return true;
 }catch(error){
  console.error(error);
  status('Save failed: '+error.message,true);
  return false;
 }
}

function scheduleSave(){
 if(isLoading)return;
 status('Saving changes...');
 clearTimeout(saveTimer);
 saveTimer=setTimeout(()=>saveCurrent(true),700);
}

async function createDocument(){
 await saveCurrent(false);

 const folders=await getAll(FOLDER_STORE);
 const selected=folders.find(f=>f.id===$('folderFilter').value);
 const folder=selected||folders[0];
 const now=new Date().toISOString();

 const doc={
  id:makeId(),
  title:'Untitled document',
  html:'<p><br></p>',
  folder:folder.id,
  createdAt:now,
  updatedAt:now
 };

 await putOne(DOC_STORE,doc);
 await openDocument(doc.id);
}

async function openDocument(id){
 if(id===currentId)return;
 await saveCurrent(false);

 const doc=await getOne(DOC_STORE,id);
 if(!doc){status('Document not found',true);return;}

 isLoading=true;
 currentId=id;

 $('docTitle').value=doc.title||'Untitled document';
 $('folderSelect').value=doc.folder||'general';

 quill.setText('');
 quill.clipboard.dangerouslyPasteHTML(doc.html||'<p><br></p>','silent');
 quill.history.clear();

 isLoading=false;
 status('Document opened');
 await refreshLibrary();
}

async function createFolder(){
 const name=prompt('Enter folder name:');
 if(!name||!name.trim())return;

 const clean=name.trim().slice(0,60);
 const folders=await getAll(FOLDER_STORE);

 if(folders.some(f=>f.name.toLowerCase()===clean.toLowerCase())){
  alert('Folder already exists.');
  return;
 }

 const folder={id:makeId(),name:clean,createdAt:new Date().toISOString()};
 await putOne(FOLDER_STORE,folder);
 await refreshFolders();
 $('folderFilter').value=folder.id;
 $('folderSelect').value=folder.id;
 await saveCurrent(true);
 await refreshLibrary();
}

async function deleteCurrent(){
 if(!currentId)return;
 const doc=await getOne(DOC_STORE,currentId);
 if(!doc)return;

 if(!confirm('Delete '+doc.title+'?'))return;
 await deleteOne(DOC_STORE,currentId);
 currentId=null;

 const docs=await getAll(DOC_STORE);
 if(docs.length){
  docs.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  await openDocument(docs[0].id);
 }else{
  await createDocument();
 }
 await refreshLibrary();
}

function download(filename,content,type){
 const blob=new Blob([content],{type});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download=filename;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function safeName(name){
 return (name||'document').replace(/[\\/:*?"<>|]/g,'-').trim()||'document';
}

function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

async function exportHtml(){
 await saveCurrent(false);
 const doc=await getOne(DOC_STORE,currentId);
 if(!doc)return;

 const output='<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+
 escapeHtml(doc.title)+'</title><style>body{max-width:794px;margin:40px auto;padding:20px;font-family:Arial;line-height:1.6}img{max-width:100%;height:auto}</style></head><body>'+
 doc.html+'</body></html>';

 download(safeName(doc.title)+'.html',output,'text/html;charset=utf-8');
}

async function exportBackup(){
 await saveCurrent(false);
 const backup={
  app:'QUANTAM DOCS',
  version:1,
  exportedAt:new Date().toISOString(),
  folders:await getAll(FOLDER_STORE),
  documents:await getAll(DOC_STORE)
 };

 download('QUANTAM-DOCS-BACKUP.json',JSON.stringify(backup,null,2),'application/json');
}

async function importBackup(file){
 if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(data.app!=='QUANTAM DOCS'||!Array.isArray(data.documents)||!Array.isArray(data.folders)){
   throw new Error('Invalid backup file');
  }

  if(!confirm('Import '+data.documents.length+' documents?'))return;

  for(const f of data.folders){
   if(!f.name)continue;
   const all=await getAll(FOLDER_STORE);
   if(!all.some(x=>x.name.toLowerCase()===f.name.toLowerCase())){
    await putOne(FOLDER_STORE,{id:makeId(),name:f.name,createdAt:new Date().toISOString()});
   }
  }

  const folders=await getAll(FOLDER_STORE);

  for(const doc of data.documents){
   if(!doc||typeof doc.html!=='string')continue;
   const oldFolder=data.folders.find(f=>f.id===doc.folder);
   const folder=folders.find(f=>f.name===(oldFolder?.name||'General'))||folders[0];

   await putOne(DOC_STORE,{
    id:makeId(),
    title:String(doc.title||'Imported document'),
    html:doc.html,
    folder:folder.id,
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString()
   });
  }
  await refreshFolders();
  await refreshLibrary();
  alert('Backup imported.');
 }catch(error){
  alert('Import failed: '+error.message);
 }
}

async function init(){
 if(!window.Quill){
  status('Editor library failed to load. Check internet.',true);
  return;
 }

 if(!window.indexedDB){
  status('IndexedDB is not supported in this browser.',true);
  return;
 }

 const Font=Quill.import('attributors/class/font');
 Font.whitelist=FONT_NAMES;
 Quill.register(Font,true);

 const Size=Quill.import('attributors/style/size');
 Size.whitelist=['8pt','10pt','11pt','12pt','14pt','16pt','18pt','20pt','24pt','28pt','36pt','48pt','72pt'];
 Quill.register(Size,true);

 quill=new Quill('#editor',{
  theme:'snow',
  placeholder:'Start writing your document...',
  modules:{
   toolbar:'#toolbar',
   history:{delay:800,maxStack:100,userOnly:true}
  }
 });

 try{
  db=await openDatabase();
  await ensureFolder();
  await migrateOldDocument();
  await refreshFolders();

  let docs=await getAll(DOC_STORE);
  if(!docs.length){
   await createDocument();
  }else{
   docs.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
   await openDocument(docs[0].id);
  }
  
window.QUANTAM_IMAGE_MANAGER.create(quill, scheduleSave);
  window.QUANTAM_DOCUMENT_TOOLS.create(quill, scheduleSave);
window.QUANTAM_PAGE_LAYOUT.create();
  
  quill.on('text-change',scheduleSave);
  $('docTitle').addEventListener('input',scheduleSave);
  $('folderSelect').addEventListener('change',scheduleSave);
  

  $('saveBtn').addEventListener('click',()=>saveCurrent(true));
  $('newBtn').addEventListener('click',createDocument);
  $('newFolderBtn').addEventListener('click',createFolder);
  $('deleteBtn').addEventListener('click',deleteCurrent);

  $('undoBtn').addEventListener('click',()=>quill.history.undo());
  $('redoBtn').addEventListener('click',()=>quill.history.redo());

  $('htmlBtn').addEventListener('click',exportHtml);
  $('backupBtn').addEventListener('click',exportBackup);
  $('printBtn').addEventListener('click',()=>window.print());

  $('searchDocs').addEventListener('input',refreshLibrary);
  $('folderFilter').addEventListener('change',refreshLibrary);

  $('importBtn').addEventListener('click',()=>$('importFile').click());
  $('importFile').addEventListener('change',async e=>{
   await importBackup(e.target.files[0]);
   e.target.value='';
  });

  window.addEventListener('beforeunload',()=>{
   if(saveTimer){
    clearTimeout(saveTimer);
    saveCurrent(false);
   }
  });

  await refreshLibrary();
  status('Ready');

 }catch(error){
  console.error(error);
  status('Library error: '+error.message,true);
 }
}

if(document.readyState==='loading'){
 document.addEventListener('DOMContentLoaded',init);
}else{
 init();
}

})();
</script>
</body>
</html>
