
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>QUANTAM DOCS — Editor</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">

<style>
:root {
  --bg:#f3f5f9;
  --panel:#fff;
  --ink:#172033;
  --muted:#697386;
  --line:#e3e7ef;
  --accent:#4f46e5;
  --dark:#111827;
}

* { box-sizing:border-box; }

html,body {
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:var(--bg);
}

.topbar {
  min-height:58px;
  background:var(--dark);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 18px;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
}

.brand {
  font-weight:800;
  letter-spacing:.5px;
  font-size:17px;
  white-space:nowrap;
}

.brand span { color:#a5b4fc; }

.top-actions {
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.top-actions button,
.top-actions a {
  border:1px solid #4b5563;
  background:#1f2937;
  color:#fff;
  border-radius:8px;
  padding:8px 11px;
  font-size:13px;
  text-decoration:none;
  cursor:pointer;
}

.top-actions button.primary {
  background:var(--accent);
  border-color:var(--accent);
}

.workspace {
  max-width:1200px;
  margin:18px auto;
  padding:0 16px;
}

.docbar {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.doc-title {
  font-size:18px;
  font-weight:700;
  border:1px solid transparent;
  background:transparent;
  padding:8px 10px;
  border-radius:7px;
  min-width:220px;
  max-width:100%;
  outline:none;
}

.doc-title:focus {
  border-color:#c7d2fe;
  background:#fff;
}

.status {
  font-size:12px;
  color:var(--muted);
}

.toolbar-wrap {
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px 10px 0 0;
  position:sticky;
  top:58px;
  z-index:10;
  box-shadow:0 2px 8px #1018280a;
}

#toolbar {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:2px;
  padding:8px 10px;
  border:0!important;
}

#toolbar .ql-formats {
  margin-right:7px!important;
  display:inline-flex;
  align-items:center;
  gap:2px;
}

#toolbar button {
  width:32px;
  height:30px;
  border-radius:5px!important;
}

#toolbar select {
  height:30px;
  max-width:110px;
  border-radius:5px!important;
}

#toolbar .ql-size { width:82px; }
#toolbar .ql-header { width:105px; }

.extra-tools {
  display:flex;
  gap:6px;
  align-items:center;
  padding:0 10px 9px;
  flex-wrap:wrap;
}

.extra-tools button {
  border:1px solid var(--line);
  background:#fff;
  color:#273247;
  border-radius:7px;
  padding:6px 10px;
  cursor:pointer;
  font-size:12px;
}

.editor-stage {
  background:#e9edf4;
  border:1px solid var(--line);
  border-top:0;
  padding:26px 12px 50px;
  min-height:70vh;
}

#editor {
  width:min(100%,794px);
  min-height:1050px;
  margin:0 auto;
  background:#fff;
  border:1px solid #d9dee8;
  box-shadow:0 5px 22px #10182812;
}

#editor.ql-container {
  font-family:Arial,Helvetica,sans-serif;
  font-size:12pt;
  border:1px solid #d9dee8!important;
}

#editor .ql-editor {
  min-height:1050px;
  padding:76px 76px 90px;
  line-height:1.6;
  font-size:12pt;
  overflow-wrap:anywhere;
}

#editor .ql-editor.ql-blank::before {
  left:76px;
  right:76px;
  color:#9aa3b2;
  font-style:normal;
}

#editor .ql-editor img {
  max-width:100%;
  height:auto;
}

.ql-snow .ql-picker.ql-size .ql-picker-label::before,
.ql-snow .ql-picker.ql-size .ql-picker-item::before {
  content:attr(data-value);
}

.ql-snow .ql-picker.ql-size .ql-picker-label:not([data-value])::before,
.ql-snow .ql-picker.ql-size .ql-picker-item:not([data-value])::before {
  content:'12pt';
}

.ql-snow .ql-picker.ql-header .ql-picker-label::before,
.ql-snow .ql-picker.ql-header .ql-picker-item::before {
  content:'Normal';
}

.ql-snow .ql-picker.ql-header .ql-picker-label[data-value="1"]::before,
.ql-snow .ql-picker.ql-header .ql-picker-item[data-value="1"]::before {
  content:'Heading 1';
}

.ql-snow .ql-picker.ql-header .ql-picker-label[data-value="2"]::before,
.ql-snow .ql-picker.ql-header .ql-picker-item[data-value="2"]::before {
  content:'Heading 2';
}

.ql-snow .ql-picker.ql-header .ql-picker-label[data-value="3"]::before,
.ql-snow .ql-picker.ql-header .ql-picker-item[data-value="3"]::before {
  content:'Heading 3';
}

.notice {
  max-width:794px;
  margin:10px auto 0;
  color:#667085;
  font-size:12px;
  text-align:center;
}

#imageInput { display:none; }

@media(max-width:700px) {
  .topbar {
    min-height:56px;
    padding:9px 10px;
    flex-wrap:wrap;
  }

  .brand { font-size:15px; }

  .top-actions { gap:5px; }

  .top-actions button,
  .top-actions a {
    padding:7px 8px;
    font-size:12px;
  }

  .workspace {
    margin:10px auto;
    padding:0 7px;
  }

  .doc-title {
    font-size:16px;
    min-width:170px;
  }

  .toolbar-wrap { top:56px; }

  #toolbar {
    padding:6px;
    gap:0;
  }

  #toolbar .ql-formats {
    margin:0 4px 4px 0!important;
  }

  #toolbar button {
    width:29px;
    height:29px;
  }

  #toolbar select { height:29px; }
  #toolbar .ql-header { width:92px; }

  .editor-stage {
    padding:10px 0 30px;
    min-height:65vh;
  }

  #editor {
    width:100%;
    min-height:calc(100vh - 260px);
    border-left:0!important;
    border-right:0!important;
    box-shadow:none;
  }

  #editor .ql-editor {
    min-height:calc(100vh - 260px);
    padding:28px 20px 60px;
    font-size:12pt;
  }

  #editor .ql-editor.ql-blank::before {
    left:20px;
    right:20px;
  }

  .extra-tools { padding:0 7px 7px; }
}

@media print {
  body { background:#fff; }

  .topbar,
  .docbar,
  .toolbar-wrap,
  .notice {
    display:none!important;
  }

  .workspace {
    margin:0;
    padding:0;
    max-width:none;
  }

  .editor-stage {
    padding:0;
    background:#fff;
    border:0;
  }

  #editor {
    width:100%;
    min-height:0;
    border:0;
    box-shadow:none;
  }

  #editor .ql-editor {
    min-height:0;
    padding:0;
    overflow:visible;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">QUANTAM <span>DOCS</span></div>

  <div class="top-actions">
    <a href="./index.html">← Dashboard</a>
    <button id="downloadBtn" type="button">Download HTML</button>
    <button id="printBtn" type="button">Print / PDF</button>
    <button id="saveBtn" class="primary" type="button">Save</button>
  </div>
</header>

<main class="workspace">

  <div class="docbar">
    <input
      id="docTitle"
      class="doc-title"
      type="text"
      value="Untitled document"
      aria-label="Document title"
      maxlength="100"
    >
    <span id="saveStatus" class="status" role="status">
      Not saved yet
    </span>
  </div>

  <section class="toolbar-wrap" aria-label="Document formatting tools">

    <div id="toolbar">

      <span class="ql-formats">
        <select class="ql-header" aria-label="Heading">
          <option selected></option>
          <option value="1"></option>
          <option value="2"></option>
          <option value="3"></option>
        </select>

        <select class="ql-size" aria-label="Font size">
          <option value="8pt">8</option>
          <option value="9pt">9</option>
          <option value="10pt">10</option>
          <option value="11pt">11</option>
          <option value="12pt" selected>12</option>
          <option value="14pt">14</option>
          <option value="16pt">16</option>
          <option value="18pt">18</option>
          <option value="20pt">20</option>
          <option value="24pt">24</option>
          <option value="28pt">28</option>
          <option value="36pt">36</option>
          <option value="48pt">48</option>
          <option value="72pt">72</option>
        </select>
      </span>

      <span class="ql-formats">
        <button class="ql-bold" aria-label="Bold"></button>
        <button class="ql-italic" aria-label="Italic"></button>
        <button class="ql-underline" aria-label="Underline"></button>
        <button class="ql-strike" aria-label="Strikethrough"></button>
      </span>

      <span class="ql-formats">
        <select class="ql-color" aria-label="Text colour"></select>
        <select class="ql-background" aria-label="Highlight colour"></select>
      </span>

      <span class="ql-formats">
        <button class="ql-list" value="ordered" aria-label="Numbered list"></button>
        <button class="ql-list" value="bullet" aria-label="Bulleted list"></button>
        <button class="ql-blockquote" aria-label="Quote"></button>
      </span>

      <span class="ql-formats">
        <select class="ql-align" aria-label="Text alignment">
          <option selected></option>
          <option value="center"></option>
          <option value="right"></option>
          <option value="justify"></option>
        </select>

        <button class="ql-indent" value="-1" aria-label="Decrease indent"></button>
        <button class="ql-indent" value="+1" aria-label="Increase indent"></button>
      </span>

      <span class="ql-formats">
        <button class="ql-link" aria-label="Insert link"></button>
        <button id="imageButton" type="button" aria-label="Insert image">▧</button>
        <button class="ql-clean" aria-label="Clear formatting"></button>
      </span>

    </div>

    <div class="extra-tools">
      <button id="undoBtn" type="button">↶ Undo</button>
      <button id="redoBtn" type="button">↷ Redo</button>
      <button id="newDocBtn" type="button">＋ New document</button>
    </div>

  </section>

  <section class="editor-stage">
    <div id="editor"><p><br></p></div>

    <p class="notice">
      Your document is saved in this browser on this device.
      Download an HTML copy for a separate backup.
    </p>
  </section>

</main>

<input
  id="imageInput"
  type="file"
  accept="image/png,image/jpeg,image/webp,image/gif"
>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'quantam_docs_document_v2';
  const OLD_KEY = 'quantam_document';

  const $ = (id) => document.getElementById(id);

  const statusEl = $('saveStatus');

  let saveTimer = null;
  let quill;

  function setStatus(message, isError = false) {
    statusEl.textContent = message;
    statusEl.style.color = isError ? '#b42318' : '#697386';
  }

  function getSavedDocument() {
    try {
      const current = localStorage.getItem(STORAGE_KEY);

      if (current) {
        return JSON.parse(current);
      }

      const old = localStorage.getItem(OLD_KEY);

      if (old) {
        const parsed = JSON.parse(old);

        if (typeof parsed === 'string') {
          return {
            title:'Untitled document',
            html:parsed
          };
        }

        if (parsed && typeof parsed === 'object') {
          return {
            title:parsed.title || parsed.name || 'Untitled document',
            html:parsed.html || parsed.content || parsed.contentHTML || ''
          };
        }
      }

    } catch (error) {
      console.warn('Could not read saved document:', error);
      setStatus('Previous saved data could not be read', true);
    }

    return null;
  }

  function saveDocument(showMessage = true) {
    const payload = {
      title:$('docTitle').value.trim() || 'Untitled document',
      html:quill.root.innerHTML,
      updatedAt:new Date().toISOString()
    };

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));

      if (showMessage) {
        setStatus(
          'Saved on this device · ' +
          new Date().toLocaleTimeString()
        );
      }

      return true;

    } catch (error) {
      console.error('Save failed:', error);

      setStatus(
        'Save failed: browser storage is full. Download a backup.',
        true
      );

      return false;
    }
  }

  function scheduleSave() {
    setStatus('Unsaved changes…');

    clearTimeout(saveTimer);

    saveTimer = setTimeout(() => {
      saveDocument(true);
    }, 700);
  }

  function downloadFile(filename, content, type) {
    const blob = new Blob([content], {type});

    const url = URL.createObjectURL(blob);

    const link = document.createElement('a');

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);

    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function safeFilename(name) {
    return (
      name || 'quantam-document'
    ).replace(/[\\/:*?"<>|]+/g, '-').trim() ||
      'quantam-document';
  }

  function exportHtml() {
    const title =
      $('docTitle').value.trim() || 'Untitled document';

    const escapedTitle = title.replace(/[&<>"']/g, c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c]));

    const html =
      '<!DOCTYPE html><html lang="en"><head>' +
      '<meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>' + escapedTitle + '</title>' +
      '<style>' +
      'body{font-family:Arial,sans-serif;max-width:794px;margin:40px auto;padding:0 24px;line-height:1.6}' +
      'img{max-width:100%;height:auto}' +
      '@media print{body{margin:0;max-width:none}}' +
      '</style></head><body>' +
      quill.root.innerHTML +
      '</body></html>';

    downloadFile(
      safeFilename(title) + '.html',
      html,
      'text/html;charset=utf-8'
    );
  }

  function insertImage(file) {
    if (!file) return;

    if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) {
      alert('Please choose a PNG, JPG, WEBP or GIF image.');
      return;
    }

    if (file.size > 1.5 * 1024 * 1024) {
      alert(
        'Image is larger than 1.5 MB. ' +
        'Please choose a smaller image to avoid filling browser storage.'
      );
      return;
    }

    const reader = new FileReader();

    reader.onload = () => {
      const range = quill.getSelection(true) || {
        index:Math.max(0, quill.getLength() - 1)
      };

      quill.insertEmbed(
        range.index,
        'image',
        reader.result,
        'user'
      );

      quill.setSelection(
        range.index + 1,
        0,
        'silent'
      );

      scheduleSave();
    };

    reader.onerror = () => {
      alert('Image could not be read. Try another image.');
    };

    reader.readAsDataURL(file);
  }

  function init() {

    if (!window.Quill) {
      setStatus(
        'Editor library did not load. Check your internet connection and reload.',
        true
      );

      $('editor').innerHTML =
        '<p style="padding:20px;color:#b42318">' +
        'QUANTAM DOCS editor could not load. ' +
        'Please connect to the internet and reload this page.' +
        '</p>';

      return;
    }

    const SizeStyle =
      Quill.import('attributors/style/size');

    SizeStyle.whitelist = [
      '8pt','9pt','10pt','11pt','12pt',
      '14pt','16pt','18pt','20pt','24pt',
      '28pt','36pt','48pt','72pt'
    ];

    Quill.register(SizeStyle, true);

    quill = new Quill('#editor', {
      theme:'snow',

      placeholder:'Start writing your document…',

      modules:{
        toolbar:{
          container:'#toolbar'
        },

        history:{
          delay:800,
          maxStack:100,
          userOnly:true
        }
      }
    });

    const saved = getSavedDocument();

    if (saved) {
      $('docTitle').value =
        saved.title || 'Untitled document';

      if (saved.html) {
        quill.root.innerHTML = saved.html;
      }

      setStatus('Saved document loaded');
    }

    quill.on('text-change', (delta, oldDelta, source) => {
      if (source === 'user') {
        scheduleSave();
      }
    });

    $('docTitle').addEventListener(
      'input',
      scheduleSave
    );

    $('saveBtn').addEventListener(
      'click',
      () => saveDocument(true)
    );

    $('downloadBtn').addEventListener(
      'click',
      () => {
        saveDocument(false);
        exportHtml();
      }
    );

    $('printBtn').addEventListener(
      'click',
      () => window.print()
    );

    $('undoBtn').addEventListener(
      'click',
      () => quill.history.undo()
    );

    $('redoBtn').addEventListener(
      'click',
      () => quill.history.redo()
    );

    $('imageButton').addEventListener(
      'click',
      () => $('imageInput').click()
    );

    $('imageInput').addEventListener(
      'change',
      (event) => {
        insertImage(
          event.target.files && event.target.files[0]
        );

        event.target.value = '';
      }
    );

    $('newDocBtn').addEventListener(
      'click',
      () => {
        if (!confirm(
          'Start a new blank document? Download or save your current document first.'
        )) {
          return;
        }

        $('docTitle').value = 'Untitled document';

        quill.setText('');

        saveDocument(true);
      }
    );

    window.addEventListener('beforeunload', () => {
      if (saveTimer) {
        clearTimeout(saveTimer);
        saveDocument(false);
      }
    });

  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</body>
</html>
