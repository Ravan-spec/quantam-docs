
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10172a">
<title>QUANTAM DOCS Editor</title>

<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 font-family:Arial,sans-serif;
 background:#eef1f6;
 color:#202b3d;
}

.topbar{
 height:62px;
 background:#10172a;
 color:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 gap:10px;
}

.brand{
 font-size:19px;
 font-weight:bold;
}

.brand span{color:#5796ff;}

.top-actions{
 display:flex;
 align-items:center;
 gap:10px;
}

.top-actions button{
 padding:9px 13px;
 border:0;
 border-radius:6px;
 cursor:pointer;
}

.save{
 background:#2868ed;
 color:white;
}

.back{
 background:#273654;
 color:white;
}

.titlebar{
 background:white;
 padding:12px 20px;
 border-bottom:1px solid #ddd;
}

.titlebar input{
 width:100%;
 max-width:450px;
 border:0;
 outline:0;
 font-size:17px;
 font-weight:bold;
}

.toolbar{
 background:#fff;
 padding:12px;
 display:flex;
 flex-wrap:wrap;
 align-items:center;
 gap:7px;
 border-bottom:1px solid #dce1e9;
 position:sticky;
 top:0;
 z-index:5;
}

.toolbar button,
.toolbar select,
.toolbar input{
 height:34px;
 min-width:34px;
 border:1px solid #d9dfeb;
 border-radius:5px;
 background:white;
 padding:5px 8px;
 cursor:pointer;
}

.toolbar button:hover{
 background:#eaf1ff;
}

.toolbar input[type=color]{
 width:40px;
 padding:3px;
}

.workspace{
 padding:30px 15px;
 display:flex;
 justify-content:center;
 min-height:calc(100vh - 160px);
}

.page{
 width:816px;
 min-height:1056px;
 background:white;
 padding:75px 80px;
 box-shadow:0 3px 18px rgba(0,0,0,.09);
 outline:none;
 font-family:Arial,sans-serif;
 font-size:16px;
 line-height:1.6;
 overflow-wrap:anywhere;
}

.page:empty:before{
 content:"Start typing your document here...";
 color:#adb5c3;
 pointer-events:none;
}

.statusbar{
 position:fixed;
 bottom:0;
 left:0;
 width:100%;
 height:30px;
 background:#10172a;
 color:#cbd5e5;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:0 15px;
 font-size:11px;
}

@media(max-width:600px){
 .topbar{padding:0 10px;}
 .brand{font-size:16px;}
 .top-actions button{padding:8px;}
 .toolbar{gap:5px;padding:8px;}
 .workspace{padding:12px 5px 40px;}
 .page{
  width:100%;
  min-height:750px;
  padding:35px 22px;
 }
}
</style>
</head>

<body>

<header class="topbar">
 <div class="brand">QUANTAM <span>DOCS</span></div>

 <div class="top-actions">
  <button class="back" onclick="location.href='index.html'">
   Home
  </button>
  <button class="save" onclick="saveDocument()">
   Save
  </button>
 </div>
</header>

<div class="titlebar">
 <input id="docTitle" value="Untitled Document"
 placeholder="Document Name">
</div>

<div class="toolbar">

 <button onclick="command('undo')" title="Undo">↶</button>
 <button onclick="command('redo')" title="Redo">↷</button>

 <select onchange="changeFont(this.value)">
  <option value="Arial">Arial</option>
  <option value="Times New Roman">Times New Roman</option>
  <option value="Georgia">Georgia</option>
  <option value="Verdana">Verdana</option>
  <option value="Courier New">Courier New</option>
 </select>

 <select onchange="changeSize(this.value)">
  <option value="3">12</option>
  <option value="4" selected>14</option>
  <option value="5">18</option>
  <option value="6">24</option>
  <option value="7">36</option>
 </select>

 <button onclick="command('bold')"><b>B</b></button>
 <button onclick="command('italic')"><i>I</i></button>
 <button onclick="command('underline')"><u>U</u></button>

 <input type="color" value="#000000"
 onchange="changeColor(this.value)" title="Text Color">

 <button onclick="command('justifyLeft')">≡</button>
 <button onclick="command('justifyCenter')">☰</button>
 <button onclick="command('justifyRight')">≣</button>

 <button onclick="command('insertUnorderedList')">• List</button>
 <button onclick="command('insertOrderedList')">1. List</button>

 <select onchange="changeHeading(this.value)">
  <option value="P">Normal Text</option>
  <option value="H1">Heading 1</option>
  <option value="H2">Heading 2</option>
  <option value="H3">Heading 3</option>
 </select>

 <button onclick="insertLink()">Link</button>
 <button onclick="insertImage()">Image</button>

</div>

<main class="workspace">

 <div
  class="page"
  id="editor"
  contenteditable="true"
  spellcheck="true"
 >
 </div>

</main>

<div class="statusbar">
 <span id="wordCount">Words: 0</span>
 <span id="saveStatus">Ready</span>
</div>

<script>
const editor = document.getElementById("editor");
const titleInput = document.getElementById("docTitle");

function command(name){
 editor.focus();
 document.execCommand(name,false,null);
}

function changeFont(font){
 editor.focus();
 document.execCommand("fontName",false,font);
}

function changeSize(size){
 editor.focus();
 document.execCommand("fontSize",false,size);
}

function changeColor(color){
 editor.focus();
 document.execCommand("foreColor",false,color);
}

function changeHeading(value){
 editor.focus();
 document.execCommand("formatBlock",false,value);
}

function insertLink(){
 const url=prompt("Enter link URL:");
 if(url){
  editor.focus();
  document.execCommand("createLink",false,url);
 }
}

function insertImage(){
 const input=document.createElement("input");
 input.type="file";
 input.accept="image/*";

 input.onchange=function(){
  const file=input.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){
   editor.focus();
   document.execCommand(
    "insertImage",false,reader.result
   );
  };

  reader.readAsDataURL(file);
 };

 input.click();
}

function updateCount(){
 const text=editor.innerText.trim();
 const words=text?text.split(/\s+/).length:0;

 document.getElementById("wordCount").textContent=
 "Words: "+words;
}

editor.addEventListener("input",function(){
 updateCount();
 document.getElementById("saveStatus").textContent=
 "Unsaved changes";
});

function saveDocument(){
 const data={
  title:titleInput.value,
  content:editor.innerHTML,
  updatedAt:new Date().toISOString()
 };

 localStorage.setItem(
  "quantam_document",
  JSON.stringify(data)
 );

 document.getElementById("saveStatus").textContent=
 "Saved locally";
}

function loadDocument(){
 const saved=localStorage.getItem("quantam_document");

 if(saved){
  try{
   const data=JSON.parse(saved);
   titleInput.value=data.title||"Untitled Document";
   editor.innerHTML=data.content||"";
  }catch(error){
   console.error("Document loading failed",error);
  }
 }

 updateCount();
}

loadDocument();
</script>

</body>
</html>
