
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>QUANTAM DOCS</title>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f4f8;color:#182033;font-family:Arial,sans-serif}
button,input,select{font:inherit}
.topbar{background:#111827;color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{font-size:17px;font-weight:800}.brand span{color:#a5b4fc}
.actions{display:flex;gap:7px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid #d8deea;background:white;color:#182033;border-radius:7px;padding:8px 11px}
button.primary{background:#4f46e5;color:white;border-color:#4f46e5}
button.danger{color:#b42318}
button:disabled{opacity:.5;cursor:not-allowed}
.layout{max-width:1400px;margin:auto;padding:14px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px}
.panel{background:white;border:1px solid #e0e5ee;border-radius:10px;padding:13px;min-width:0}
.sidebar h3{margin:2px 0 12px}
.sidebar input,.sidebar select{width:100%;padding:9px;border:1px solid #dce1e9;border-radius:7px;margin:5px 0 10px}
.doclist{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.docitem{border:1px solid #e4e8ef;border-radius:8px;padding:10px;text-align:left;width:100%;background:#fff}
.docitem.active{border-color:#6366f1;background:#eef2ff}
.docitem strong{display:block;overflow-wrap:anywhere}
.docitem small{display:block;color:#697386;margin-top:5px}
.main{min-width:0}
.docbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#docTitle{font-size:18px;font-weight:bold;border:1px solid transparent;background:transparent;padding:8px;min-width:180px;max-width:100%;border-radius:7px}
#docTitle:focus{outline:none;border-color:#a5b4fc;background:white}
#folderSelect{padding:8px;border:1px solid #dce1e9;border-radius:7px;background:white}
#status{font-size:12px;color:#697386}
.toolbar{background:white;border:1px solid #e0e5ee;border-radius:9px 9px 0 0;position:sticky;top:56px;z-index:10}
#toolbar{border:0!important;display:flex;flex-wrap:wrap;gap:2px;padding:8px}
#toolbar .ql-formats{margin-right:6px!important}
#toolbar button{padding:0;border:0}
#toolbar select{max-width:100px}
.extra{display:flex;gap:7px;flex-wrap:wrap;padding:0 9px 9px}
.stage{background:#e9edf4;padding:20px 10px 45px;border:1px solid #e0e5ee;border-top:0}
#editor{width:min(100%,794px);margin:auto;background:white;border:1px solid #d8deea;box-shadow:0 4px 18px #11182712}
#editor.ql-container{font-size:12pt;font-family:Arial,sans-serif}
#editor .ql-editor{min-height:1000px;padding:65px 70px;line-height:1.6;overflow-wrap:anywhere}
#editor .ql-editor.ql-blank::before{left:70px;right:70px}
.library-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.hint{font-size:12px;color:#697386;line-height:1.5}
.empty{color:#697386;text-align:center;padding:25px 8px;font-size:13px}
@media(max-width:760px){
 .layout{grid-template-columns:1fr;padding:8px;gap:9px}
 .sidebar{order:2}
 .main{order:1}
 .topbar{padding:10px}
 .brand{font-size:15px}
 .actions button{padding:7px 8px;font-size:12px}
 .toolbar{top:54px}
 #toolbar{padding:5px}
 #toolbar .ql-formats{margin-right:3px!important}
 #toolbar button{width:29px;height:29px}
 #toolbar select{height:29px}
 .stage{padding:8px 0 25px}
 #editor{width:100%;border-left:0;border-right:0;box-shadow:none}
 #editor .ql-editor{min-height:75vh;padding:28px 19px}
 #editor .ql-editor.ql-blank::before{left:19px;right:19px}
}
@media print{
 .topbar,.sidebar,.docbar,.toolbar,.no-print{display:none!important}
 .layout{display:block;padding:0}
 .panel{border:0;padding:0}
 .stage{background:white;padding:0;border:0}
 #editor{width:100%;border:0;box-shadow:none}
 #editor .ql-editor{padding:0;min-height:0}
}
</style>
</head>

<body>

<header class="topbar">
 <div class="brand">QUANTAM <span>DOCS</span></div>
 <div class="actions">
  <a href="./index.html" style="color:white;text-decoration:none;padding:8px">Dashboard</a>
  <button id="saveBtn" class="primary">Save</button>
  <button id="htmlBtn">Download HTML</button>
  <button id="backupBtn">Backup All</button>
  <button id="printBtn">Print / PDF</button>
 </div>
</header>

<div class="layout">

 <aside class="panel sidebar">
  <h3>My Library</h3>

  <button id="newBtn" class="primary" style="width:100%">＋ New Document</button>
  <button id="newFolderBtn" style="width:100%;margin-top:7px">＋ Create Folder</button>

  <label class="hint" for="folderFilter">Filter folder</label>
  <select id="folderFilter">
   <option value="all">All folders</option>
  </select>

  <input id="searchDocs" type="search" placeholder="Search documents...">

  <div id="docList" class="doclist">
   <div class="empty">Loading Library...</div>
  </div>

  <div class="library-actions">
   <button id="importBtn">Import Backup</button>
   <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>

  <p class="hint">
   Documents are stored in this browser using IndexedDB.
   Use Backup All to keep a copy on your device.
  </p>
 </aside>

 <main class="main">
  <div class="panel">
   <div class="docbar">
    <input id="docTitle" value="Untitled document" maxlength="100" aria-label="Document title">
    <select id="folderSelect" aria-label="Document folder"></select>
    <span id="status">Loading...</span>
   </div>
  </div>

  <section class="toolbar">
   <div id="toolbar">
    <span class="ql-formats">
     <select class="ql-header">
      <option selected></option>
      <option value="1"></option>
      <option value="2"></option>
      <option value="3"></option>
     </select>
     <select class="ql-size">
      <option value="8pt">8</option>
      <option value="10pt">10</option>
      <option value="11pt">11</option>
      <option value="12pt" selected>12</option>
      <option value="14pt">14</option>
      <option value="16pt">16</option>
      <option value="18pt">18</option>
      <option value="20pt">20</option>
      <option value="24pt">24</option>
      <option value="28pt">28</option>
      <option value="36pt">36</option>
      <option value="48pt">48</option>
      <option value="72pt">72</option>
     </select>
    </span>
    <span class="ql-formats">
     <button class="ql-bold"></button>
     <button class="ql-italic"></button>
     <button class="ql-underline"></button>
     <button class="ql-strike"></button>
    </span>
    <span class="ql-formats">
     <select class="ql-color"></select>
     <select class="ql-background"></select>
    </span>
    <span class="ql-formats">
     <button class="ql-list" value="ordered"></button>
     <button class="ql-list" value="bullet"></button>
     <button class="ql-blockquote"></button>
    </span>
    <span class="ql-formats">
     <select class="ql-align">
      <option selected></option>
      <option value="center"></option>
      <option value="right"></option>
      <option value="justify"></option>
     </select>
     <button class="ql-indent" value="-1"></button>
     <button class="ql-indent" value="+1"></button>
    </span>
    <span class="ql-formats">
     <button class="ql-link"></button>
     <button class="ql-image"></button>
     <button class="ql-clean"></button>
    </span>
   </div>
   <div class="extra">
    <button id="undoBtn">↶ Undo</button>
    <button id="redoBtn">↷ Redo</button>
    <button id="deleteBtn" class="danger">Delete Current Document</button>
   </div>
  </section>

  <section class="stage">
   <div id="editor"><p><br></p></div>
  </section>
 </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

<script>
(() => {
'use strict';

const DB_NAME = 'QUANTAM_DOCS_LIBRARY';
const DB_VERSION = 1;
const DOC_STORE = 'documents';
const FOLDER_STORE = 'folders';

let db;
let quill;
let currentId = null;
let saveTimer = null;
let isLoading = false;

const $ = id => document.getElementById(id);

function makeId(){
 return (crypto.randomUUID ?
  crypto.randomUUID() :
  'doc-' + Date.now() + '-' + Math.random().toString(36).slice(2));
}

function setStatus(message, error=false){
 $('status').textContent = message;
 $('status').style.color = error ? '#b42318' : '#697386';
}

function requestResult(request){
 return new Promise((resolve,reject)=>{
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}

function openDatabase(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open(DB_NAME,DB_VERSION);

  request.onupgradeneeded=()=>{
   const database=request.result;

   if(!database.objectStoreNames.contains(DOC_STORE)){
    const store=database.createObjectStore(DOC_STORE,{keyPath:'id'});
    store.createIndex('updatedAt','updatedAt');
    store.createIndex('folder','folder');
   }

   if(!database.objectStoreNames.contains(FOLDER_STORE)){
    database.createObjectStore(FOLDER_STORE,{keyPath:'id'});
   }
  };

  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}

function getAll(storeName){
 return requestResult(
  db.transaction(storeName,'readonly')
    .objectStore(storeName).getAll()
 );
}

function getOne(storeName,id){
 return requestResult(
  db.transaction(storeName,'readonly')
    .objectStore(storeName).get(id)
 );
}

function putOne(storeName,value){
 return requestResult(
  db.transaction(storeName,'readwrite')
    .objectStore(storeName).put(value)
 );
}

function deleteOne(storeName,id){
 return requestResult(
  db.transaction(storeName,'readwrite')
    .objectStore(storeName).delete(id)
 );
}

async function ensureDefaultFolder(){
 let folders=await getAll(FOLDER_STORE);

 if(!folders.length){
  await putOne(FOLDER_STORE,{
   id:'general',
   name:'General',
   createdAt:new Date().toISOString()
  });
 }
}

async function migrateOldDocument(){
 const existing=await getAll(DOC_STORE);
 if(existing.length) return;

 let old=null;

 try{
  const raw=localStorage.getItem('quantam_docs_document_v2') ||
            localStorage.getItem('quantam_document');

  if(raw) old=JSON.parse(raw);
 }catch(e){
  console.warn('Old document migration failed',e);
 }

 if(old){
  let title='Imported document';
  let html='';

  if(typeof old==='string'){
   html=old;
  }else{
   title=old.title || old.name || title;
   html=old.html || old.content || old.contentHTML || '';
  }

  await putOne(DOC_STORE,{
   id:makeId(),
   title,
   html,
   folder:'general',
   createdAt:new Date().toISOString(),
   updatedAt:new Date().toISOString()
  });
 }
}

async function refreshFolders(){
 const folders=await getAll(FOLDER_STORE);
 const filter=$('folderFilter');
 const select=$('folderSelect');
 const oldFilter=filter.value;
 const oldFolder=select.value;

 filter.innerHTML='';
 select.innerHTML='';

 const all=document.createElement('option');
 all.value='all';
 all.textContent='All folders';
 filter.appendChild(all);

 folders.sort((a,b)=>a.name.localeCompare(b.name));

 for(const folder of folders){
  const a=document.createElement('option');
  a.value=folder.id;
  a.textContent=folder.name;
  filter.appendChild(a);

  const b=document.createElement('option');
  b.value=folder.id;
  b.textContent=folder.name;
  select.appendChild(b);
 }

 if([...filter.options].some(o=>o.value===oldFilter)){
  filter.value=oldFilter;
 }

 if([...select.options].some(o=>o.value===oldFolder)){
  select.value=oldFolder;
 }else if(select.options.length){
  select.value=select.options[0].value;
 }
}

async function refreshLibrary(){
 const docs=await getAll(DOC_STORE);
 const folders=await getAll(FOLDER_STORE);
 const folderMap=new Map(folders.map(f=>[f.id,f.name]));

 const list=$('docList');
 const query=$('searchDocs').value.trim().toLowerCase();
 const selectedFolder=$('folderFilter').value;

 list.innerHTML='';

 const filtered=docs
  .filter(doc=>{
   const matchesFolder=selectedFolder==='all' ||
     doc.folder===selectedFolder;
   const matchesSearch=(doc.title || '').toLowerCase().includes(query);
   return matchesFolder && matchesSearch;
  })
  .sort((a,b)=>(b.updatedAt || '').localeCompare(a.updatedAt || ''));

 if(!filtered.length){
  list.innerHTML='<div class="empty">No documents found. Create a new document.</div>';
  return;
 }

 for(const doc of filtered){
  const button=document.createElement('button');
  button.className='docitem'+(doc.id===currentId?' active':'');
  button.type='button';

  const title=document.createElement('strong');
  title.textContent=doc.title || 'Untitled document';

  const meta=document.createElement('small');
  const date=doc.updatedAt ? new Date(doc.updatedAt).toLocaleString() : '';
  meta.textContent=(folderMap.get(doc.folder)||'General')+' · '+date;

  button.append(title,meta);
  button.addEventListener('click',()=>openDocument(doc.id));

  list.appendChild(button);
 }
}

async function createDocument(){
 await saveCurrent(false);

 const folders=await getAll(FOLDER_STORE);
 const folder=folders.find(f=>f.id===$('folderFilter').value) ||
              folders.find(f=>f.id==='general') ||
              folders[0];

 const now=new Date().toISOString();

 const doc={
  id:makeId(),
  title:'Untitled document',
  html:'<p><br></p>',
  folder:folder.id,
  createdAt:now,
  updatedAt:now
 };

 await putOne(DOC_STORE,doc);
 await refreshFolders();
 await openDocument(doc.id);
}

async function openDocument(id){
 if(id===currentId) return;

 await saveCurrent(false);

 const doc=await getOne(DOC_STORE,id);

 if(!doc){
  setStatus('Document not found',true);
  return;
 }

 isLoading=true;
 currentId=id;

 $('docTitle').value=doc.title || 'Untitled document';
 $('folderSelect').value=doc.folder || 'general';

 quill.setText('');
 quill.clipboard.dangerouslyPasteHTML(
  doc.html || '<p><br></p>',
  'silent'
 );

 quill.history.clear();

 isLoading=false;

 setStatus('Document opened');
 await refreshLibrary();
}

async function saveCurrent(showMessage=true){
 if(!currentId || !quill || isLoading) return false;

 clearTimeout(saveTimer);

 const old=await getOne(DOC_STORE,currentId);

 if(!old) return false;

 const doc={
  ...old,
  title:$('docTitle').value.trim() || 'Untitled document',
  folder:$('folderSelect').value || 'general',
  html:quill.root.innerHTML,
  updatedAt:new Date().toISOString()
 };

 try{
  await putOne(DOC_STORE,doc);

  if(showMessage) setStatus('Saved successfully');

  await refreshLibrary();
  return true;

 }catch(error){
  console.error(error);
  setStatus('Save failed: browser storage error',true);
  return false;
 }
}

function scheduleSave(){
 if(isLoading) return;

 setStatus('Saving changes...');

 clearTimeout(saveTimer);

 saveTimer=setTimeout(()=>{
  saveCurrent(true);
 },600);
}

async function deleteCurrent(){
 if(!currentId) return;

 const doc=await getOne(DOC_STORE,currentId);
 if(!doc) return;

 if(!confirm('Delete "'+doc.title+'"? This cannot be undone.')) return;

 await deleteOne(DOC_STORE,currentId);
 currentId=null;

 const remaining=await getAll(DOC_STORE);

 if(remaining.length){
  remaining.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  await openDocument(remaining[0].id);
 }else{
  await createDocument();
 }

 await refreshLibrary();
}

async function createFolder(){
 const name=prompt('Enter folder name:');
 if(!name || !name.trim()) return;

 const clean=name.trim().slice(0,60);
 const folders=await getAll(FOLDER_STORE);

 if(folders.some(f=>f.name.toLowerCase()===clean.toLowerCase())){
  alert('This folder already exists.');
  return;
 }

 const folder={
  id:makeId(),
  name:clean,
  createdAt:new Date().toISOString()
 };

 await putOne(FOLDER_STORE,folder);
 await refreshFolders();
 $('folderFilter').value=folder.id;
 $('folderSelect').value=folder.id;
 await saveCurrent(true);
 await refreshLibrary();
}

function download(filename,content,type){
 const blob=new Blob([content],{type});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download=filename;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function cleanFilename(name){
 return (name||'document')
  .replace(/[\\/:*?"<>|]/g,'-')
  .trim() || 'document';
}

async function exportHtml(){
 await saveCurrent(false);

 const doc=await getOne(DOC_STORE,currentId);
 if(!doc) return;

 const html='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+
  escapeHtml(doc.title)+
  '</title><style>body{max-width:794px;margin:40px auto;padding:20px;font-family:Arial;line-height:1.6}img{max-width:100%;height:auto}</style></head><body>'+
  doc.html+'</body></html>';

 download(cleanFilename(doc.title)+'.html',html,'text/html;charset=utf-8');
}

function escapeHtml(text){
 return String(text).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

async function exportBackup(){
 await saveCurrent(false);

 const docs=await getAll(DOC_STORE);
 const folders=await getAll(FOLDER_STORE);

 const backup={
  app:'QUANTAM DOCS',
  version:1,
  exportedAt:new Date().toISOString(),
  folders,
  documents:docs
 };

 download(
  'QUANTAM-DOCS-BACKUP-'+new Date().toISOString().slice(0,10)+'.json',
  JSON.stringify(backup,null,2),
  'application/json'
 );
}

async function importBackup(file){
 if(!file) return;

 try{
  const backup=JSON.parse(await file.text());

  if(backup.app!=='QUANTAM DOCS' ||
     !Array.isArray(backup.documents) ||
     !Array.isArray(backup.folders)){
   throw new Error('Invalid QUANTAM DOCS backup file');
  }

  if(!confirm('Import '+backup.documents.length+' documents? Existing documents will be kept.')) return;

  for(const folder of backup.folders){
   if(!folder || !folder.name) continue;

   const folders=await getAll(FOLDER_STORE);
   const exists=folders.find(f=>
    f.name.toLowerCase()===folder.name.toLowerCase()
   );

   if(!exists){
    await putOne(FOLDER_STORE,{
     id:makeId(),
     name:folder.name,
     createdAt:new Date().toISOString()
    });
   }
  }

  const currentFolders=await getAll(FOLDER_STORE);

  for(const doc of backup.documents){
   if(!doc || typeof doc.html!=='string') continue;

   const matching=currentFolders.find(f=>
    f.name===(
     backup.folders.find(x=>x.id===doc.folder)?.name || 'General'
    )
   );

   await putOne(DOC_STORE,{
    id:makeId(),
    title:String(doc.title||'Imported document'),
    html:doc.html,
    folder:matching ? matching.id : 'general',
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString()
   });
  }

  await refreshFolders();
  await refreshLibrary();

  alert('Backup imported successfully.');

 }catch(error){
  console.error(error);
  alert('Import failed: '+error.message);
 }
}

async function init(){
 if(!window.Quill){
  setStatus('Editor library failed to load. Check internet.',true);
  return;
 }

 if(!window.indexedDB){
  setStatus('This browser does not support IndexedDB.',true);
  return;
 }

 const SizeStyle=Quill.import('attributors/style/size');
 SizeStyle.whitelist=[
  '8pt','10pt','11pt','12pt','14pt','16pt',
  '18pt','20pt','24pt','28pt','36pt','48pt','72pt'
 ];
 Quill.register(SizeStyle,true);

 quill=new Quill('#editor',{
  theme:'snow',
  placeholder:'Start writing your document...',
  modules:{
   toolbar:'#toolbar',
   history:{delay:800,maxStack:100,userOnly:true}
  }
 });

 try{
  db=await openDatabase();

  await ensureDefaultFolder();
  await migrateOldDocument();
  await refreshFolders();

  let docs=await getAll(DOC_STORE);

  if(!docs.length){
   await createDocument();
  }else{
   docs.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
   await openDocument(docs[0].id);
  }

  quill.on('text-change',scheduleSave);

  $('docTitle').addEventListener('input',scheduleSave);
  $('folderSelect').addEventListener('change',scheduleSave);

  $('saveBtn').addEventListener('click',()=>saveCurrent(true));
  $('newBtn').addEventListener('click',createDocument);
  $('newFolderBtn').addEventListener('click',createFolder);
  $('deleteBtn').addEventListener('click',deleteCurrent);

  $('undoBtn').addEventListener('click',()=>quill.history.undo());
  $('redoBtn').addEventListener('click',()=>quill.history.redo());

  $('htmlBtn').addEventListener('click',exportHtml);
  $('backupBtn').addEventListener('click',exportBackup);
  $('printBtn').addEventListener('click',()=>window.print());

  $('searchDocs').addEventListener('input',refreshLibrary);
  $('folderFilter').addEventListener('change',refreshLibrary);

  $('importBtn').addEventListener('click',()=>$('importFile').click());

  $('importFile').addEventListener('change',async e=>{
   await importBackup(e.target.files[0]);
   e.target.value='';
  });

  window.addEventListener('beforeunload',()=>{
   if(saveTimer){
    clearTimeout(saveTimer);
    saveCurrent(false);
   }
  });

  await refreshLibrary();

 }catch(error){
  console.error(error);
  setStatus('Library initialization failed: '+error.message,true);
 }
}

if(document.readyState==='loading'){
 document.addEventListener('DOMContentLoaded',init);
}else{
 init();
}

})();
</script>
</body>
</html>
