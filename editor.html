
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10172a">
<title>QUANTAM DOCS Editor</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#e9edf4;color:#202b3d}
button,select,input{font:inherit}
.topbar{height:58px;background:#10172a;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{font-weight:bold;font-size:20px}
.brand span{color:#60a5fa}
.actions{display:flex;gap:8px}
.actions button{padding:9px 15px;border:0;border-radius:5px;background:#263958;color:white;cursor:pointer}
.actions .save{background:#2563eb}
.titlebar{background:white;padding:12px 20px;border-bottom:1px solid #ddd}
#docTitle{border:0;outline:0;font-size:19px;font-weight:bold;width:100%;max-width:600px}
.ribbon{background:#fff;padding:9px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;border-bottom:1px solid #d5dce8;position:sticky;top:0;z-index:10}
.group{display:flex;align-items:center;gap:5px;padding-right:9px;border-right:1px solid #dce1e9}
.ribbon button,.ribbon select,.ribbon input{height:35px;border:1px solid #d7deea;background:white;border-radius:5px;padding:5px 8px;cursor:pointer}
.ribbon button{min-width:35px}
.ribbon button:hover,.ribbon select:hover{background:#eaf2ff}
.ribbon input[type=color]{width:42px;padding:3px}
.ribbon select{max-width:140px}
.workspace{padding:25px 12px 55px;display:flex;justify-content:center;min-height:calc(100vh - 155px)}
.page{width:816px;max-width:100%;min-height:1056px;background:white;padding:75px 80px;box-shadow:0 3px 18px #00000012;outline:none;overflow-wrap:anywhere;font-family:Arial,sans-serif;font-size:12px;line-height:1.6}
.page:empty:before{content:"Start typing your document here...";color:#aab3c1;pointer-events:none}
.page img{max-width:100%;height:auto}
.page table{border-collapse:collapse;width:100%}
.page td,.page th{border:1px solid #555;padding:7px}
.page ul,.page ol{padding-left:30px}
.statusbar{position:fixed;bottom:0;left:0;width:100%;height:29px;background:#10172a;color:#cbd5e5;display:flex;justify-content:space-between;align-items:center;padding:0 15px;font-size:11px;z-index:20}
@media(max-width:600px){
.topbar{padding:0 9px}
.brand{font-size:15px}
.actions button{padding:8px}
.ribbon{gap:5px;padding:7px}
.group{gap:3px;padding-right:5px}
.ribbon button,.ribbon select{font-size:12px;padding:4px}
.workspace{padding:10px 5px 45px}
.page{min-height:750px;padding:35px 22px}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">QUANTAM <span>DOCS</span></div>
  <div class="actions">
    <button type="button" onclick="goHome()">Home</button>
    <button type="button" class="save" onclick="saveDocument()">Save</button>
  </div>
</header>

<div class="titlebar">
  <input id="docTitle" value="Untitled Document" placeholder="Document Name">
</div>

<div class="ribbon">

  <div class="group">
    <button type="button" data-cmd="undo" title="Undo">↶</button>
    <button type="button" data-cmd="redo" title="Redo">↷</button>
  </div>

  <div class="group">
    <select id="fontFamily" title="Font">
      <option value="Arial">Arial</option>
      <option value="Times New Roman">Times New Roman</option>
      <option value="Georgia">Georgia</option>
      <option value="Verdana">Verdana</option>
      <option value="Courier New">Courier New</option>
    </select>

    <select id="fontSize" title="Font Size">
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12" selected>12</option>
      <option value="14">14</option>
      <option value="16">16</option>
      <option value="18">18</option>
      <option value="20">20</option>
      <option value="24">24</option>
      <option value="28">28</option>
      <option value="32">32</option>
      <option value="36">36</option>
      <option value="48">48</option>
      <option value="72">72</option>
    </select>
  </div>

  <div class="group">
    <button type="button" data-cmd="bold"><b>B</b></button>
    <button type="button" data-cmd="italic"><i>I</i></button>
    <button type="button" data-cmd="underline"><u>U</u></button>
    <button type="button" data-cmd="strikeThrough"><s>S</s></button>
  </div>

  <div class="group">
    <input type="color" id="textColor" value="#000000" title="Text Colour">
    <input type="color" id="highlightColor" value="#ffff00" title="Highlight Colour">
  </div>

  <div class="group">
    <button type="button" data-cmd="justifyLeft">Left</button>
    <button type="button" data-cmd="justifyCenter">Center</button>
    <button type="button" data-cmd="justifyRight">Right</button>
    <button type="button" data-cmd="justifyFull">Justify</button>
  </div>

  <div class="group">
    <select id="heading" title="Paragraph Style">
      <option value="P">Normal</option>
      <option value="H1">Heading 1</option>
      <option value="H2">Heading 2</option>
      <option value="H3">Heading 3</option>
    </select>
  </div>

  <div class="group">
    <button type="button" data-cmd="insertUnorderedList">• List</button>
    <button type="button" data-cmd="insertOrderedList">1. List</button>
  </div>

  <div class="group">
    <button type="button" id="linkButton">Link</button>
    <button type="button" id="imageButton">Image</button>
    <button type="button" id="tableButton">Table</button>
  </div>

  <div class="group">
    <button type="button" id="clearButton">Clear Format</button>
  </div>

</div>

<main class="workspace">
  <div class="page" id="editor" contenteditable="true" spellcheck="true"></div>
</main>

<input type="file" id="imageInput" accept="image/*" hidden>

<div class="statusbar">
  <span id="wordCount">Words: 0</span>
  <span id="saveStatus">Ready</span>
</div>

<script>
const editor=document.getElementById("editor");
const titleInput=document.getElementById("docTitle");
const saveStatus=document.getElementById("saveStatus");

let savedRange=null;

function rememberSelection(){
  const selection=window.getSelection();
  if(selection && selection.rangeCount){
    const range=selection.getRangeAt(0);
    if(editor.contains(range.commonAncestorContainer)){
      savedRange=range.cloneRange();
    }
  }
}

document.addEventListener("selectionchange",rememberSelection);

function restoreSelection(){
  editor.focus();
  if(savedRange){
    const selection=window.getSelection();
    selection.removeAllRanges();
    selection.addRange(savedRange);
  }
}

function updateSelection(){
  const selection=window.getSelection();
  if(selection && selection.rangeCount){
    const range=selection.getRangeAt(0);
    if(editor.contains(range.commonAncestorContainer)){
      savedRange=range.cloneRange();
    }
  }
}

function runCommand(command,value=null){
  restoreSelection();
  document.execCommand(command,false,value);
  updateSelection();
  updateCount();
  markUnsaved();
}

document.querySelectorAll("[data-cmd]").forEach(button=>{
  button.addEventListener("mousedown",e=>e.preventDefault());
  button.addEventListener("click",()=>{
    runCommand(button.dataset.cmd);
  });
});

function applyStyle(styleName,value){
  restoreSelection();
  const selection=window.getSelection();

  if(!selection || !selection.rangeCount){
    alert("Pehle text select karo.");
    return;
  }

  const range=selection.getRangeAt(0);

  if(range.collapsed){
    alert("Pehle text select karo.");
    return;
  }

  const span=document.createElement("span");
  span.style[styleName]=value;

  try{
    span.appendChild(range.extractContents());
    range.insertNode(span);

    const newRange=document.createRange();
    newRange.selectNodeContents(span);
    selection.removeAllRanges();
    selection.addRange(newRange);
    savedRange=newRange.cloneRange();
  }catch(error){
    console.error(error);
    alert("Formatting apply nahi ho payi.");
  }

  updateCount();
  markUnsaved();
}

document.getElementById("fontSize").addEventListener("change",function(){
  applyStyle("fontSize",this.value+"px");
});

document.getElementById("fontFamily").addEventListener("change",function(){
  applyStyle("fontFamily",this.value);
});

document.getElementById("textColor").addEventListener("input",function(){
  applyStyle("color",this.value);
});

document.getElementById("highlightColor").addEventListener("input",function(){
  applyStyle("backgroundColor",this.value);
});

document.getElementById("heading").addEventListener("change",function(){
  runCommand("formatBlock","<"+this.value+">");
});

document.getElementById("linkButton").addEventListener("mousedown",e=>e.preventDefault());

document.getElementById("linkButton").addEventListener("click",()=>{
  const url=prompt("Enter full URL (https://...)");
  if(!url)return;

  if(!/^https?:\/\//i.test(url)){
    alert("Enter a valid http or https URL.");
    return;
  }

  runCommand("createLink",url);
});

document.getElementById("imageButton").addEventListener("mousedown",e=>e.preventDefault());

document.getElementById("imageButton").addEventListener("click",()=>{
  document.getElementById("imageInput").click();
});

document.getElementById("imageInput").addEventListener("change",function(){
  const file=this.files[0];
  if(!file)return;

  if(!file.type.startsWith("image/")){
    alert("Select a valid image.");
    return;
  }

  const reader=new FileReader();

  reader.onload=()=>{
    restoreSelection();

    const img=document.createElement("img");
    img.src=reader.result;
    img.alt=file.name;

    const selection=window.getSelection();

    if(selection && selection.rangeCount){
      const range=selection.getRangeAt(0);
      range.deleteContents();
      range.insertNode(img);
      range.setStartAfter(img);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      savedRange=range.cloneRange();
    }else{
      editor.appendChild(img);
    }

    updateCount();
    markUnsaved();
  };

  reader.readAsDataURL(file);
  this.value="";
});

document.getElementById("tableButton").addEventListener("mousedown",e=>e.preventDefault());

document.getElementById("tableButton").addEventListener("click",()=>{
  const rows=parseInt(prompt("Number of rows:", "3"));
  const cols=parseInt(prompt("Number of columns:", "3"));

  if(!Number.isInteger(rows)||!Number.isInteger(cols)||rows<1||cols<1||rows>20||cols>10){
    alert("Enter valid rows (1–20) and columns (1–10).");
    return;
  }

  let html="<table><tbody>";

  for(let r=0;r<rows;r++){
    html+="<tr>";
    for(let c=0;c<cols;c++){
      html+="<td><br></td>";
    }
    html+="</tr>";
  }

  html+="</tbody></table><p><br></p>";
  runCommand("insertHTML",html);
});

document.getElementById("clearButton").addEventListener("mousedown",e=>e.preventDefault());
document.getElementById("clearButton").addEventListener("click",()=>{
  runCommand("removeFormat");
});

function updateCount(){
  const text=editor.innerText.trim();
  const words=text ? text.split(/\s+/).length : 0;
  document.getElementById("wordCount").textContent="Words: "+words;
}

function markUnsaved(){
  saveStatus.textContent="Unsaved changes";
}

function saveDocument(){
  const data={
    title:titleInput.value.trim()||"Untitled Document",
    content:editor.innerHTML,
    updatedAt:new Date().toISOString()
  };

  try{
    localStorage.setItem("quantam_document",JSON.stringify(data));
    saveStatus.textContent="Saved locally";
  }catch(error){
    saveStatus.textContent="Save failed";
    alert("Browser storage unavailable or full.");
  }
}

function loadDocument(){
  try{
    const saved=localStorage.getItem("quantam_document");

    if(saved){
      const data=JSON.parse(saved);
      titleInput.value=data.title||"Untitled Document";
      editor.innerHTML=data.content||"";
    }
  }catch(error){
    console.error(error);
    saveStatus.textContent="Load failed";
  }

  updateCount();
}

function goHome(){
  window.location.href="./index.html";
}

editor.addEventListener("input",()=>{
  updateCount();
  markUnsaved();
  rememberSelection();
});

titleInput.addEventListener("input",markUnsaved);

loadDocument();
</script>

</body>
</html>
